name: Auto Requirement Numbering

on:
  issues:
    types: [opened]

jobs:
  add-requirement-id:
    if: contains(github.event.issue.labels.*.name, 'requirement')
    runs-on: ubuntu-latest
    steps:
      - name: Get issue number
        id: vars
        run: echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV

      - name: Add comment with requirement ID
        run: |
          REPO_NAME="${{ github.repository }}"
          ISSUE_NUMBER="${{ env.ISSUE_NUMBER }}"
          REQUIREMENT_ID="FR-KIO2-$(printf "%03d" $ISSUE_NUMBER)"

          echo "Creating requirement ID: $REQUIREMENT_ID"

          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO_NAME/issues/$ISSUE_NUMBER/comments \
            -d "{\"body\": \"🔢 **Assigned Requirement ID**: \`$REQUIREMENT_ID\`\"}"

      - name: Prepend to body (optional – if you'd rather overwrite template)
        run: |
          REPO_NAME="${{ github.repository }}"
          ISSUE_NUMBER="${{ env.ISSUE_NUMBER }}"
          BODY=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                      -H "Accept: application/vnd.github+json" \
                      https://api.github.com/repos/$REPO_NAME/issues/$ISSUE_NUMBER | jq -r .body)

          REQUIREMENT_ID="FR-KIO2-$(printf "%03d" $ISSUE_NUMBER)"
          UPDATED_BODY="### 🔢 Requirement ID: \`$REQUIREMENT_ID\`\n\n$BODY"

          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO_NAME/issues/$ISSUE_NUMBER \
            -d "{\"body\": \"$UPDATED_BODY\"}"
