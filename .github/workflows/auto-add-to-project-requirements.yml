
name: Auto-add requirement issues to project and column

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    if: contains(github.event.issue.labels.*.name, 'requirement')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      project: write
    steps:
      - name: Add issue to project and set status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const projectNumber = 6;
            const org = "ai4sweng";
            const projectTitle = "AI4SWENG KIO2";

            const projects = await github.graphql(`
              query {
                organization(login: "${org}") {
                  projectsV2(first: 20) {
                    nodes {
                      id
                      number
                      title
                      fields(first: 20) {
                        nodes {
                          id
                          name
                          dataType
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `);

            const project = projects.organization.projectsV2.nodes.find(p => p.number === projectNumber && p.title === projectTitle);
            if (!project) throw new Error("Project not found");

            const itemResult = await github.graphql(`
              mutation($projectId:ID!, $contentId:ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item {
                    id
                  }
                }
              }
            `, {
              projectId: project.id,
              contentId: context.payload.issue.node_id
            });

            const itemId = itemResult.addProjectV2ItemById.item.id;
            console.log("Added item ID:", itemId);

            const statusField = project.fields.nodes.find(f => f.name === "Status" && f.dataType === "SINGLE_SELECT");
            if (!statusField) throw new Error("Status field not found");

            const reqOption = statusField.options.find(o => o.name.toLowerCase() === "requirements");
            if (!reqOption) throw new Error("'Requirements' column not found in status options");

            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: {
                    singleSelectOptionId: $optionId
                  }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `, {
              projectId: project.id,
              itemId: itemId,
              fieldId: statusField.id,
              optionId: reqOption.id
            });

            console.log("Set item to 'Requirements'");
