# Re-run the same code after environment reset to regenerate the smart issue routing GitHub Action YAML

final_smart_workflow = """
name: Smart Issue Router to Project Columns

on:
  issues:
    types: [opened]

jobs:
  assign-to-project:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Assign issue to AI4SWENG KIO2 project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const org = "ai4sweng";
            const projectNumber = 31;
            const projectTitle = "AI4SWENG KIO2";
            const title = context.payload.issue.title;
            const labels = context.payload.issue.labels.map(l => l.name);
            const issueNodeId = context.payload.issue.node_id;

            // Determine type and column
            let column = null;
            if (title.includes("[TASK]")) {
              column = "Backlog";
            } else if (title.includes("[REQ]") || labels.includes("requirement")) {
              column = "Requirements";
            } else {
              console.log("❌ No matching condition found in title or labels — skipping.");
              return;
            }

            // Fetch the project
            const projects = await github.graphql(`
              query {
                organization(login: "${org}") {
                  projectsV2(first: 20) {
                    nodes {
                      id
                      number
                      title
                      fields(first: 20) {
                        nodes {
                          id
                          name
                          dataType
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `);

            const project = projects.organization.projectsV2.nodes.find(p => p.number === projectNumber && p.title === projectTitle);
            if (!project) throw new Error("❌ Project not found");

            // Add issue to project
            const itemRes = await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }
            `, {
              projectId: project.id,
              contentId: issueNodeId
            });

            const itemId = itemRes.addProjectV2ItemById.item.id;

            // Set status column
            const statusField = project.fields.nodes.find(f => f.name === "Status");
            const option = statusField.options.find(o => o.name.toLowerCase() === column.toLowerCase());

            if (!option) throw new Error(`❌ Column option '${column}' not found in project field 'Status'`);

            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: {
                    singleSelectOptionId: $optionId
                  }
                }) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId: project.id,
              itemId,
              fieldId: statusField.id,
              optionId: option.id
            });

            console.log(`✅ Issue routed to project '${projectTitle}' in '${column}' column`);
"""

from pathlib import Path
smart_action_path = Path("/mnt/data/smart-issue-to-project.yml")
smart_action_path.write_text(final_smart_workflow)
smart_action_path.name
