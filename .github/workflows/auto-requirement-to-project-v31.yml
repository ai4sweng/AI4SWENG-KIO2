# Regenerate the fixed GitHub Action files without the invalid 'project' permission key

def generate_fixed_action(label, column, project_number):
    return f"""
name: Auto-Assign {label.capitalize()} to Project Column

on:
  issues:
    types: [opened]

jobs:
  assign-{label}:
    if: contains(github.event.issue.labels.*.name, '{label}')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: write
    steps:
      - name: Assign {label} to AI4SWENG KIO2 > {column}
        uses: actions/github-script@v7
        with:
          github-token: ${{{{ secrets.GITHUB_TOKEN }}}}
          script: |
            const org = "ai4sweng";
            const projectNumber = {project_number};
            const projectTitle = "AI4SWENG KIO2";
            const issueNodeId = context.payload.issue.node_id;

            const projects = await github.graphql(`
              query {{
                organization(login: "${{org}}") {{
                  projectsV2(first: 20) {{
                    nodes {{
                      id
                      number
                      title
                      fields(first: 20) {{
                        nodes {{
                          id
                          name
                          dataType
                          options {{
                            id
                            name
                          }}
                        }}
                      }}
                    }}
                  }}
                }}
              }}
            `);

            const project = projects.organization.projectsV2.nodes.find(p => p.number === projectNumber && p.title === projectTitle);
            if (!project) throw new Error("Project not found");

            const itemRes = await github.graphql(`
              mutation($projectId:ID!, $contentId:ID!) {{
                addProjectV2ItemById(input: {{projectId: $projectId, contentId: $contentId}}) {{
                  item {{ id }}
                }}
              }}
            `, {{
              projectId: project.id,
              contentId: issueNodeId
            }});

            const itemId = itemRes.addProjectV2ItemById.item.id;

            const statusField = project.fields.nodes.find(f => f.name === "Status");
            const option = statusField.options.find(o => o.name.toLowerCase() === "{column.lower()}");

            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {{
                updateProjectV2ItemFieldValue(input: {{
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: {{
                    singleSelectOptionId: $optionId
                  }}
                }}) {{
                  projectV2Item {{ id }}
                }}
              }}
            `, {{
              projectId: project.id,
              itemId,
              fieldId: statusField.id,
              optionId: option.id
            }});
"""

# Generate actions
requirement_fixed = generate_fixed_action("requirement", "Requirements", 31)
task_fixed = generate_fixed_action("task", "Backlog", 31)

# Write to files
requirement_path = Path("/mnt/data/fixed-auto-requirement-to-project.yml")
task_path = Path("/mnt/data/fixed-auto-task-to-project.yml")

requirement_path.write_text(requirement_fixed)
task_path.write_text(task_fixed)

[requirement_path.name, task_path.name]
