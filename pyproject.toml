[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4sweng-kio2"
version = "1.3.0"
description = "AI4SWENG KIO2 — Bug Locate & Fix: Reverse Execution & Dynamic Slicing (BitNet)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "BitNet" }]

dependencies = [
    # FocusTracer, the trace/slicing engine (>= 1.9), is not on PyPI: it is
    # installed from its public repository, so `pip install` of KIO2 needs no
    # separate step. To work on the engine, `pip install -e` a local checkout.
    "focustracer @ git+https://github.com/BitnetTR/focustracer.git@master",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
observability = ["opentelemetry-sdk", "opentelemetry-exporter-otlp"]
dev = ["pytest>=7.4", "httpx>=0.27"]  # httpx powers fastapi.testclient (tests/test_http_contract.py)

[tool.setuptools.packages.find]
where = ["src"]
include = ["kio2*"]

[tool.setuptools.package-data]
# The schemas (GET /schema) and the playground page (GET /playground) are served at runtime.
"kio2" = ["examples/*.py", "schemas/*.json", "playground/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# FR-KIO2-01: minimal lint / code-style tooling for the PoC.
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Deliberately buggy sample programs: the bugs are the test data, and the
# benchmarks refer to their line numbers, so they must stay as written.
extend-exclude = ["tests/scenarios/[0-9]*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter; don't fail builds on it
